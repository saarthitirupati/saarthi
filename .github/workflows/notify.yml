name: Saarthi Push Notifications

on:
  schedule:
    # 4:30 AM IST daily (UTC 23:00 previous day) — Autonomous SSD Counters Opening
    - cron: '0 23 * * *'
    # 7:00 AM IST daily (UTC 01:30) — Daily Spot + Festival Reminder
    - cron: '30 1 * * *'
    # 8:30 AM IST daily (UTC 03:00) — Re-engagement (separate from morning content)
    - cron: '0 3 * * *'
    # 2:00 PM IST daily (UTC 08:30) — Autonomous Live Queue Status & Wait Times
    - cron: '30 8 * * *'
    # Friday 6:00 PM IST (UTC 12:30) — Weekend Suggestion
    - cron: '30 12 * * 5'
    # 9:15 PM IST daily (UTC 15:45) — Autonomous Ghat Road 11 PM Curfew Warning
    - cron: '45 15 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Notification type to send manually'
        required: false
        default: 'autonomous'
        type: choice
        options: [autonomous, daily_spot, festival, weekend, reengagement, welcome]

jobs:
  autonomous:
    name: Autonomous Engine (Ghat Curfew, SSD, Live Queue)
    if: github.event.schedule == '0 23 * * *' || github.event.schedule == '45 15 * * *' || github.event.schedule == '30 8 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.type == 'autonomous')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Autonomous Notification Cycle
        run: |
          curl -4 --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -s -L -X POST https://www.saarthiguide.in/api/push/autonomous-cron \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"dry_run":false}'

  morning:
    name: Morning Notifications (Daily Spot + Festival)
    if: github.event.schedule == '30 1 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.type == 'daily_spot' || github.event.inputs.type == 'festival'))
    runs-on: ubuntu-latest
    steps:
      - name: Send Daily Spot of the Day
        run: |
          curl -4 --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -s -f -L -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"daily_spot"}'

      - name: Send Festival Reminder (if any in 7/3/1/0 days)
        run: |
          curl -4 --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -s -L -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"festival"}'

  weekend:
    name: Weekend Suggestion (Friday evening)
    if: github.event.schedule == '30 12 * * 5'
    runs-on: ubuntu-latest
    steps:
      - name: Send Weekend Yatra Suggestion
        run: |
          curl -4 --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -s -f -L -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"weekend"}'

  reengagement:
    name: Re-engagement (inactive users)
    if: github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: 3-day inactive users
        run: |
          curl -4 --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -s -L -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"reengagement","daysSince":3}'

      - name: 7-day inactive users
        run: |
          curl -4 --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -s -L -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"reengagement","daysSince":7}'

      - name: 15-day inactive users
        run: |
          curl -4 --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -s -L -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"reengagement","daysSince":15}'

      - name: 30-day inactive users
        run: |
          curl -4 --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 -s -L -X POST https://www.saarthiguide.in/api/push/send \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"type":"reengagement","daysSince":30}'
