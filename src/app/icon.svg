<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E6B72" />
      <stop offset="100%" stop-color="#073B40" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#E9801D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Sacred Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#saffronGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#saffronGrad)" stroke-width="4" opacity="0.8" />

  <!-- Temple Gopuram / Compass Needle Fusion Emblem -->
  <g transform="translate(0, 10)">
    <!-- Gopuram Base -->
    <path d="M140 370 L372 370 L350 330 L162 330 Z" fill="url(#saffronGrad)" />
    <path d="M162 330 L350 330 L330 280 L182 280 Z" fill="url(#saffronGrad)" opacity="0.9" />
    <path d="M182 280 L330 280 L310 230 L202 230 Z" fill="url(#saffronGrad)" opacity="0.95" />
    <path d="M202 230 L310 230 L286 170 L226 170 Z" fill="url(#goldGlow)" />

    <!-- Kalasam Pinnacle & Compass Pointer -->
    <path d="M256 100 L276 170 L236 170 Z" fill="url(#goldGlow)" filter="url(#glow)" />
    <circle cx="256" cy="92" r="16" fill="#FDE047" />

    <!-- Central Divine Lotus / Compass Star -->
    <circle cx="256" cy="280" r="32" fill="#073B40" stroke="url(#goldGlow)" stroke-width="5" />
    <path d="M256 254 L264 280 L256 306 L248 280 Z" fill="#FDE047" />
    <path d="M230 280 L256 272 L282 280 L256 288 Z" fill="#FDE047" />
  </g>
</svg>
